services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clearledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "python -m alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8001"
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clearledger
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
