name: ClearLedger load benchmark

on:
  push:
    branches: [benchmark-locust-20261117]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/load-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clearledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: benchmark_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clearledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:benchmark_only_password@127.0.0.1:5432/clearledger
      JWT_SECRET_KEY: synthetic-benchmark-key-only-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install app and benchmarking dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install locust requests
      - name: Migrate the temporary test database
        run: python -m alembic upgrade head
      - name: Launch local API
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 > /tmp/clearledger-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/clearledger-api.log
          exit 1
      - name: Import and verify 10,000 synthetic transactions
        run: python benchmarks/seed.py
      - name: Run 60-user authenticated Locust workload
        run: |
          mkdir -p benchmarks/results
          python -m locust -f benchmarks/locustfile.py --headless \
            --users 60 --spawn-rate 10 --run-time 90s \
            --host http://127.0.0.1:8001 \
            --csv benchmarks/results/locust --csv-full-history
      - name: Summarize P95, request count, and errors
        if: success()
        run: |
          python benchmarks/report.py
          cat benchmarks/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload actual benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clearledger-locust-results
          path: |
            benchmarks/results/
            /tmp/clearledger-api.log
          if-no-files-found: warn
